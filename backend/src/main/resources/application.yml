server:
  port: ${SERVER_PORT:9090}
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: eszkozpont
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eszkozpont}
    username: ${DB_USERNAME:eszkozpont}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: eszkozpont
    audience: eszkozpont-web
    ttl: PT30M
  cors-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  demo-data: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
