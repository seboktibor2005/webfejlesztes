services:
  database:
    image: postgres:18.3
    environment:
      POSTGRES_DB: eszkozpont
      POSTGRES_USER: eszkozpont
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Allitsd_be_a_DB_PASSWORD_valtozot}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - eszkozpont-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eszkozpont -d eszkozpont']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  eszkozpont-data:
